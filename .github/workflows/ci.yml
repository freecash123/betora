name: BETORA CI/CD
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: betora
          POSTGRES_PASSWORD: betora
          POSTGRES_DB: betora_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd backend && npm ci
      - run: cd database && for f in migrations/*.sql; do psql -h localhost -U betora -d betora_test -f "$f"; done
        env: { PGPASSWORD: betora }
      - run: cd backend && npm test
        env: { DATABASE_URL: 'postgresql://betora:betora@localhost:5432/betora_test', REDIS_HOST: localhost, JWT_SECRET: test-secret }
      - run: cd backend && npm run build
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build
        env: { NEXT_PUBLIC_API_URL: 'http://localhost:4000' }